[project]
name = "datarelay-grant"
version = "0.1.0.dev0"
description = "Explicit human approval between intent and execution"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "argon2-cffi>=23,<26", "cryptography>=44,<47", "pyotp>=2.9,<3", "httpx>=0.28,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[project.scripts]
grant = "grant.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["grant"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
target-version = "py312"
