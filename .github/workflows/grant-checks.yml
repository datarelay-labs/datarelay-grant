name: Grant checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Prepare isolated Python tools
        run: bash scripts/checks.sh setup-api
      - name: Product static validation
        run: bash scripts/checks.sh static
      - name: Bounded API, identity, transport and recovery cases
        run: bash scripts/checks.sh api

  foundation-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require approved private Foundation read access
        env:
          FOUNDATION_READ_TOKEN: ${{ secrets.FOUNDATION_READ_TOKEN }}
        run: |
          if [ -z "$FOUNDATION_READ_TOKEN" ]; then
            echo '::error::FOUNDATION_CI_READ_ACCESS_REQUIRED: configure an approved Foundation Contents:read credential; local host credentials are not exported.'
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Resolve the committed Foundation pin
        id: foundation
        run: python3 -c 'import json; print("sha=" + json.load(open("web/foundation.lock.json"))["commit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: datarelay-labs/datarelay-product-foundation
          ref: ${{ steps.foundation.outputs.sha }}
          path: .dev/foundation-source
          token: ${{ secrets.FOUNDATION_READ_TOKEN }}
          persist-credentials: false
      - name: Resolve the private F31 source HEAD
        id: f31
        run: python3 -c 'import json; print("sha=" + json.load(open("web/foundation-f31.lock.json"))["source_head"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: datarelay-labs/datarelay-product-foundation
          ref: ${{ steps.f31.outputs.sha }}
          path: .dev/foundation-f31-source
          token: ${{ secrets.FOUNDATION_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare exact product, private F31 source and SDK dependencies
        env:
          GRANT_FOUNDATION_SOURCE: ${{ github.workspace }}/.dev/foundation-source
        run: |
          bash scripts/checks.sh setup-api
          bash scripts/checks.sh setup-node
          export PATH="$GITHUB_WORKSPACE/.dev/node-runtime/node_modules/.bin:$PATH"
          npm --prefix .dev/foundation-f31-source ci --no-audit --no-fund
          # The upstream stager uses a fresh --offline smoke directory. npm ci
          # provides the exact React tarballs but does not necessarily cache
          # package version metadata needed to prove their peer compatibility.
          # Prime that public metadata; retain strict peer checking and offline
          # npm installation in the immutable Foundation stager.
          test "$(npm view react@19.3.0 version)" = '19.3.0'
          test "$(npm view react-dom@19.3.0 version)" = '19.3.0'
          python3 tools/prepare_foundation_f31.py --source "$GITHUB_WORKSPACE/.dev/foundation-f31-source"
          bash scripts/checks.sh setup-web
      - name: Reproduce pinned approval-email shells
        run: bash scripts/checks.sh renderer
      - name: Foundation adapters, types and production web build
        run: bash scripts/checks.sh web
      - name: Install browser runtime for explicit qualification
        if: github.event_name == 'workflow_dispatch'
        run: web/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual browser qualification
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/checks.sh browser
