version: 1

setup_command: ""

paths:
  "**":
    domains:
      - "documentation"

scenarios:
  - id: ADOPTED-STATIC-001
    name: Git whitespace validation
    level: static
    domains:
      - "documentation"
    triggers:
      - pr
      - preflight
      - release
    platforms:
      - "linux"
    command: "git diff --check"
    invariants:
      - "repository diff has no whitespace errors"
    release_gate: true
