engineering_system:
  version: 1.7.0
  mode: adopted
  baseline: 72abaec3ffa4f2e7519ee8067f4b8795acd506ad
  ci_mode: native
  native_ci_workflows:
  - .github/workflows/grant-checks.yml
  merge_gate_status: unknown
  policy_epoch: 14
project:
  name: datarelay-grant
  type: approval-execution-control
  maturity: development
  user_facing: true
  primary_user_surface: browser
domains:
- approval
- automation
- integrations
- api
- documentation
platforms:
- web
operations:
  production_oriented: false
  runbook_required: true
  incident_response_required: false
  persistent_state: true
  runbook_paths:
  - docs/OPERATIONS.md
  health_command: 'uv run --frozen grant check'
  backup_command: 'uv run --frozen grant backup --output <new-private-backup-path>'
  restore_test_command: 'uv run --frozen pytest tests/test_delivery_recovery.py'
  upgrade_command: ''
  rollback_command: ''
